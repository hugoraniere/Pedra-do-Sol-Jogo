# Publica o jogo no GitHub Pages a cada push em principal.
#
# npm run build ja comeca chamando npm run verificar (ver package.json): se um
# contrato invisivel quebrar - som faltando, fala orfa, cor fora da paleta - o
# deploy para aqui, antes de publicar qualquer coisa quebrada para o Lele.
name: Publicar no GitHub Pages

on:
  push:
    branches: [principal]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
