<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2C2440">
<link rel="icon" type="image/png" href="/favicon.png">
<!-- o resto do PWA (manifest.webmanifest, o link para ele, o registro do
     service worker) e injetado sozinho no build por vite-plugin-pwa, ver
     vite.config.ts. So o que o Safari do iOS nao le do manifesto mora aqui:
     ele nao tira o icone nem o "abrir sem barra do navegador" so do
     manifesto, precisa destas tags dele mesmo. -->
<link rel="apple-touch-icon" href="/icone-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedra do Sol">
<title>A Pedra do Sol</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#2C2440;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;}
  /* em tela cheia e o #jogo que vira a tela inteira (fullscreenTarget em
     main.ts), entao a cor de fundo precisa estar aqui e nao so no body:
     senao a beirada de menos de um pixel que sobra sai preta. */
  #jogo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:#2C2440;overflow:hidden;}
  /* o cursor do sistema nunca aparece sobre o jogo: quem desenha o cursor e
     src/cenas/Ponteiro.ts. O !important existe porque o Phaser escreve
     cursor:pointer no estilo do canvas para todo objeto com useHandCursor, e
     sem isto a mao do navegador voltaria em cima de cada botao. */
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:none !important;}
</style>
</head>
<body>
  <div id="jogo"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
